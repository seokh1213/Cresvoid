x-broker: &broker
  image: ${KAFKA_IMAGE}
  healthcheck:
    test: [CMD-SHELL, '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1']
    interval: 3s
    timeout: 10s
    retries: 40
  deploy:
    resources:
      limits: { cpus: '1', memory: 576m }
x-broker-env: &broker-env
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  KAFKA_PROCESS_ROLES: broker
  KAFKA_LISTENERS: PLAINTEXT://:9092
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_CONTROLLER_QUORUM_VOTERS: 100@controller:9093
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_REPLICA_LAG_TIME_MAX_MS: 3000
  KAFKA_BROKER_SESSION_TIMEOUT_MS: 6000
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_LOG_CLEANER_ENABLE: 'false'
  KAFKA_HEAP_OPTS: -Xms64m -Xmx192m
services:
  controller:
    image: ${KAFKA_IMAGE}
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 100
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 100@controller:9093
      KAFKA_UNCLEAN_LEADER_ELECTION_INTERVAL_MS: 1000
      KAFKA_HEAP_OPTS: -Xms64m -Xmx128m
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-metadata-quorum.sh --bootstrap-controller localhost:9093 describe --status >/dev/null 2>&1']
      interval: 3s
      timeout: 10s
      retries: 40
    deploy:
      resources:
        limits: { cpus: '1', memory: 448m }
  kafka1:
    <<: *broker
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092
  kafka2:
    <<: *broker
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9092
  kafka3:
    <<: *broker
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9092
  app:
    image: ${JVM_RUNNER_IMAGE}
    volumes: ['${PROGRAM_DIR}:/work:ro']
    working_dir: /work
    command: [lab-run, kafka, lab.MainKt]
    environment:
      PORT: '${APP_PORT}'
      KAFKA_BOOTSTRAP: kafka1:9092,kafka2:9092,kafka3:9092
      JAVA_OPTS: -Xms32m -Xmx192m
    ports: ['127.0.0.1:${APP_PORT}:${APP_PORT}']
    depends_on:
      kafka1: { condition: service_healthy }
      kafka2: { condition: service_healthy }
      kafka3: { condition: service_healthy }
      controller: { condition: service_healthy }
    healthcheck:
      test: [CMD-SHELL, 'curl -fs localhost:$$PORT/health >/dev/null']
      interval: 2s
      timeout: 2s
      retries: 40
    deploy:
      resources:
        limits: { cpus: '1', memory: 384m }
