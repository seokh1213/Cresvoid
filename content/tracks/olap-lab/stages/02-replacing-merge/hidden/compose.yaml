services:
  clickhouse:
    image: ${CLICKHOUSE_IMAGE}
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports: ["127.0.0.1::8123"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- localhost:8123/ping >/dev/null"]
      interval: 1s
      timeout: 2s
      retries: 60
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }
