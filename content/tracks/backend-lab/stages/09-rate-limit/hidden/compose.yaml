services:
  redis:
    image: ${REDIS_IMAGE}
    ports: ["127.0.0.1::6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 30
    deploy:
      resources:
        limits: { cpus: "1", memory: 256m }
