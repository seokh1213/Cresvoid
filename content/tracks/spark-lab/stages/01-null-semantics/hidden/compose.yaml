services:
  app:
    image: ${JVM_RUNNER_IMAGE}
    volumes: ["${PROGRAM_DIR}:/work:ro"]
    working_dir: /work
    command: ["lab-run", "spark", "MainKt"]
    environment:
      PORT: "8080"
      SPARK_LOCAL_IP: "127.0.0.1"
      JAVA_OPTS: "-Xms256m -Xmx1g -XX:ActiveProcessorCount=2"
    ports: ["127.0.0.1::8080"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:8080/health >/dev/null"]
      interval: 1s
      timeout: 2s
      retries: 120
    deploy:
      resources:
        limits: { cpus: "2", memory: 1536m }
