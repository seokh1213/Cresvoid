services:
  app:
    image: ${JVM_RUNNER_IMAGE}
    volumes:
      - type: bind
        source: ${PROGRAM_DIR}
        target: /work
        read_only: true
    working_dir: /work
    command: ["lab-run", "spark", "lab.MainKt"]
    environment:
      PORT: "8080"
      SPARK_LOCAL_IP: "127.0.0.1"
      JAVA_OPTS: "-Xms256m -Xmx1g"
    ports: ["127.0.0.1::8080"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:8080/health >/dev/null"]
      interval: 1s
      timeout: 2s
      retries: 90
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }
