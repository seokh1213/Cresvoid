services:
  postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    ports: ["127.0.0.1::5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 1s
      timeout: 2s
      retries: 60
    deploy:
      resources:
        limits: { cpus: "1", memory: 384m }
  app:
    image: ${JVM_RUNNER_IMAGE}
    volumes: ["${PROGRAM_DIR}:/work:ro"]
    working_dir: /work
    command: ["lab-run", "jdbc-postgres", "lab.MainKt"]
    environment:
      PORT: "8080"
      JDBC_URL: jdbc:postgresql://postgres:5432/lab
    ports: ["127.0.0.1::8080"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:8080/health >/dev/null"]
      interval: 1s
      timeout: 2s
      retries: 60
    deploy:
      resources:
        limits: { cpus: "1", memory: 384m }
