services:
  mysql:
    image: ${MYSQL_IMAGE}
    environment:
      MYSQL_ROOT_PASSWORD: lab-local
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: lab
    ports: ["127.0.0.1::3306"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=lab-local mysql -uroot -h127.0.0.1 -e 'SELECT 1' lab >/dev/null 2>&1"]
      interval: 1s
      timeout: 3s
      retries: 90
    deploy:
      resources:
        limits: { cpus: "1", memory: 768m }
  app:
    image: ${JVM_RUNNER_IMAGE}
    volumes: ["${PROGRAM_DIR}:/work:ro"]
    working_dir: /work
    command: ["lab-run", "jdbc-mysql", "lab.MainKt"]
    environment:
      PORT: "8080"
      JDBC_URL: "jdbc:mysql://mysql:3306/lab?allowPublicKeyRetrieval=true&useSSL=false"
      JAVA_OPTS: "-Xmx192m"
    ports: ["127.0.0.1:${APP_PORT}:8080"]
    depends_on:
      mysql: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:8080/health >/dev/null"]
      interval: 1s
      timeout: 2s
      retries: 90
    deploy:
      resources:
        limits: { cpus: "1", memory: 384m }
